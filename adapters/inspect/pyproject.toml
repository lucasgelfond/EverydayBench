[project]
name = "everydaybench-inspect"
version = "0.1.0"
description = "EverydayBench's tasks as an Inspect eval"
requires-python = ">=3.10"
dependencies = ["inspect-ai>=0.3", "mcp", "pyyaml"]

[project.entry-points.inspect_ai]
everydaybench = "everydaybench_inspect"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
